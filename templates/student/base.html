{% extends 'base.html' %}
{% block body_class %}has-bottom-nav{% endblock %}
{% block body %}
<nav class="navbar navbar-dark sticky-top"
     style="background:var(--nt-dark-bg);z-index:200;padding-top:env(safe-area-inset-top);">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2"
       href="{{ url_for('student.exams_list') }}">
      <img src="{{ url_for('static', filename='icons/logo-mark.png') }}" alt="Nhật Tuyền" height="28">
      <span class="d-none d-sm-inline">Thi online</span>
    </a>
    <div class="d-flex align-items-center gap-2">
      <span class="text-light small text-truncate" style="max-width:160px;">
        <i class="bi bi-person-circle me-1"></i>{{ current_user.student_profile.full_name }}
      </span>
      <button title="Bật thông báo đề thi" id="pwaPushEnable" class="btn btn-sm text-light d-none action-icon-btn icon-action-plain"
              type="button" aria-label="Bật thông báo đề thi">
        <i aria-hidden="true" class="bi bi-bell"></i>
      </button>
      <a aria-label="Đổi mật khẩu" href="{{ url_for('auth.change_password') }}" class="btn btn-sm btn-outline-light action-icon-btn" title="Đổi mật khẩu">
        <i aria-hidden="true" class="bi bi-key"></i>
      </a>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-light">
        <i class="bi bi-box-arrow-right me-1"></i><span class="d-none d-sm-inline">Đăng xuất</span>
      </a>
    </div>
  </div>
</nav>

<main style="padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;">
  <div id="pwaPushMessage" class="alert alert-info mx-3 mt-3 mb-0 d-none"
       role="status"
       data-key-url="{{ url_for('student.push_public_key') }}"
       data-subscription-url="{{ url_for('student.push_subscription') }}"
       data-csrf-token="{{ csrf_token() }}"
       data-enable-message="Bật thông báo để biết ngay khi có đề thi mới."
       data-enabled-message="Đã bật thông báo đề thi."
       data-disabled-message="Đã tắt thông báo trên thiết bị này.">
    <div class="d-flex align-items-center justify-content-between gap-3">
      <span id="pwaPushMessageText">Bật thông báo để biết ngay khi có đề thi mới.</span>
      <button id="pwaPushMessageButton" class="btn btn-sm btn-primary flex-shrink-0" type="button">
        Bật thông báo
      </button>
    </div>
  </div>
  {% block content %}{% endblock %}
</main>

<nav class="navbar fixed-bottom border-top bg-white py-0"
     style="z-index:150;padding-bottom:env(safe-area-inset-bottom);">
  <div class="container-fluid p-0">
    <a href="{{ url_for('student.exams_list') }}"
       class="flex-fill d-flex flex-column align-items-center justify-content-center py-2 text-decoration-none
              {% if 'exam' in request.endpoint %}text-success border-top border-success border-2{% else %}text-muted{% endif %}"
       style="font-size:0.7rem;">
      <i class="bi bi-pc-display fs-5"></i>
      <span>Bài thi</span>
    </a>
  </div>
</nav>
<script src="{{ url_for('static', filename='js/student-push.js') }}"></script>
{% endblock %}
