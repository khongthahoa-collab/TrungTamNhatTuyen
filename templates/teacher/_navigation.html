{% macro back_button(href, destination, editor_exit=false) -%}
<a href="{{ href }}" class="btn btn-outline-secondary btn-sm teacher-back-button"
   aria-label="Quay lại {{ destination }}" title="Quay lại {{ destination }}"
   {% if editor_exit %}data-exam-editor-exit{% endif %}>
  <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Quay lại
</a>
{%- endmacro %}
